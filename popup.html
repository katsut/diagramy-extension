<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #0F1117; --surface: #1A1D27; --border: #2A2D3A; --text: #E4E4E7;
    --text-secondary: #9CA3AF; --primary: #60A5FA; --success: #34D399; --error: #F87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 380px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }

  .header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header h1 { font-size: 15px; font-weight: 700; }
  .header span { font-size: 11px; color: var(--text-secondary); }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .usage-badge { font-size: 10px; color: var(--text-secondary); }
  .btn-icon { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 4px; }
  .btn-icon:hover { color: var(--text); background: var(--surface); }

  .content { padding: 12px 16px; }

  .login-prompt { text-align: center; padding: 32px 16px; }
  .login-prompt p { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
  .btn-login { padding: 10px 24px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--primary); color: white; }
  .btn-login:hover { opacity: 0.9; }

  .selected-text {
    font-size: 12px; color: var(--text-secondary); background: var(--surface);
    padding: 8px; border-radius: 6px; margin-bottom: 12px;
    max-height: 60px; overflow: hidden; line-height: 1.4;
  }

  .suggestions { display: flex; flex-direction: column; gap: 8px; }

  .suggest-card {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: all 0.15s; background: var(--surface);
  }
  .suggest-card:hover { border-color: var(--primary); }
  .suggest-card.selected { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .sc-top { display: flex; justify-content: space-between; align-items: center; }
  .sc-type { font-size: 12px; font-weight: 600; color: var(--primary); }
  .sc-conf { font-size: 10px; color: var(--success); }
  .sc-title { font-size: 11px; color: var(--text); margin-top: 2px; }

  .result {
    margin-top: 12px; border: 1px solid var(--border); border-radius: 8px;
    min-height: 100px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: var(--surface);
  }
  .result svg { max-width: 100%; height: auto; }

  .controls { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .controls select { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; background: var(--surface); color: var(--text); }

  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button {
    flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 12px;
    font-weight: 600; cursor: pointer;
  }
  .btn-dl { background: var(--primary); color: white; }
  .btn-dl:hover { opacity: 0.9; }
  .btn-copy { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-copy:hover { border-color: var(--primary) !important; }

  .status { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 13px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { padding: 24px 16px; text-align: center; color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <h1>Figney</h1>
    <span>Text to Diagram</span>
  </div>
  <div class="header-right" id="header-right"></div>
</div>

<div class="content" id="content">
  <div class="empty" id="empty-state">テキストを選択して右クリック →<br>「Figney: 図式化」</div>
</div>

<script src="popup.js"></script>
</body>
</html>
